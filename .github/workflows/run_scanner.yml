name: Auto Market Scanner

on:
  schedule:
    - cron: '30 9 * * 1-5'
  repository_dispatch:
    types: [chain_restart]
  workflow_dispatch:
    inputs:
      run_block:
        description: 'Run block (1=2:30am-7:30am, 2=7:30am-close)'
        required: false
        default: '1'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    env:
      RUN_BLOCK: ${{ github.event.client_payload.run_block || inputs.run_block || '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Block 1 — pre-market scan + morning loop
        if: env.RUN_BLOCK == '1'
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          run_scan() {
            echo "────────────────────────────────────────"
            echo "[SCAN] $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')"
            python scanner.py
            git add signals.json
            git commit -m "Auto scan $(TZ='America/Los_Angeles' date '+%H:%M %Z')" || true
            git push
            echo "[DONE] committed signals.json"
          }

          echo "[PRE-MARKET] Running initial scan..."
          run_scan

          echo "[WAIT] Checking market open (6:30 AM PT)..."
          while ! python pt_check.py 6 30; do
            echo "[WAIT] Not open yet, sleeping 60s..."
            sleep 60
          done
          echo "[OPEN] Market is open — starting 5-min loop"

          while ! python pt_check.py 7 30; do
            run_scan
            sleep 300
          done
          echo "[HANDOFF] Reached 7:30 AM PT — dispatching Block 2"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"chain_restart","client_payload":{"run_block":"2"}}'
          echo "[CHAIN] Block 2 dispatched successfully"

      - name: Block 2 — loop to market close
        if: env.RUN_BLOCK == '2'
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
        run: |
          set -e

          run_scan() {
            echo "────────────────────────────────────────"
            echo "[SCAN] $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')"
            python scanner.py
            git add signals.json
            git commit -m "Auto scan $(TZ='America/Los_Angeles' date '+%H:%M %Z')" || true
            git push
            echo "[DONE] committed signals.json"
          }

          while ! python pt_check.py 10 0; do
            run_scan
            sleep 300
          done
          echo "[CLOSE] Market closed at 10:00 AM PT — scanner shutting down"
          echo "[DONE] Full trading day complete."
