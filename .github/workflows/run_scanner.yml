name: Auto Market Scanner

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 4:30 AM PT (PDT=UTC-7) Mon-Fri
  repository_dispatch:
    types: [chain_restart]
  workflow_dispatch:
    inputs:
      run_block:
        description: 'Run block (1=4:30am-10:30am, 2=10:30am-close)'
        required: false
        default: '1'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    env:
      RUN_BLOCK: ${{ github.event.client_payload.run_block || inputs.run_block || '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Write PT time helper
        run: |
          cat > /tmp/pt_epoch.py << 'PYEOF'
          import sys, datetime, time, os
          os.environ['TZ'] = 'America/Los_Angeles'
          time.tzset()
          h, m = int(sys.argv[1]), int(sys.argv[2])
          t = datetime.datetime.now().replace(hour=h, minute=m, second=0, microsecond=0)
          print(int(t.timestamp()))
          PYEOF

      - name: Block 1 — pre-market scan + morning loop
        if: env.RUN_BLOCK == '1'
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          run_scan() {
            echo "──────────────────────────────────────────"
            echo "[SCAN] $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')"
            python scanner.py
            git add signals.json
            git commit -m "Auto scan $(TZ='America/Los_Angeles' date '+%H:%M %Z')" || true
            git push
            echo "[DONE] committed signals.json"
          }

          # ── Single pre-market scan ──
          echo "[PRE-MARKET] Running initial scan (job start may vary due to GitHub delays)..."
          run_scan

          # ── Wait until 9:30 AM PT ──
          echo "[WAIT] Waiting for market open (9:30 AM PT)..."
          while true; do
            NOW_SEC=$(date +%s)
            OPEN_SEC=$(python3 /tmp/pt_epoch.py 9 30)
            if [ "$NOW_SEC" -ge "$OPEN_SEC" ]; then
              echo "[OPEN] Market is open — starting 5-min loop"
              break
            fi
            WAIT=$(( OPEN_SEC - NOW_SEC ))
            echo "[WAIT] ${WAIT}s until market open ($(TZ='America/Los_Angeles' date '+%H:%M %Z'))..."
            sleep 60
          done

          # ── 5-min loop until 10:30 AM PT (hand-off point) ──
          while true; do
            NOW_SEC=$(date +%s)
            HANDOFF_SEC=$(python3 /tmp/pt_epoch.py 10 30)
            if [ "$NOW_SEC" -ge "$HANDOFF_SEC" ]; then
              echo "[HANDOFF] Reached 10:30 AM PT — dispatching Block 2"
              break
            fi
            run_scan
            sleep 300
          done

          # ── Trigger Block 2 via repository_dispatch ──
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"chain_restart","client_payload":{"run_block":"2"}}'
          echo "[CHAIN] Block 2 dispatched successfully"

      - name: Block 2 — midday loop to market close
        if: env.RUN_BLOCK == '2'
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
        run: |
          set -e

          run_scan() {
            echo "──────────────────────────────────────────"
            echo "[SCAN] $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')"
            python scanner.py
            git add signals.json
            git commit -m "Auto scan $(TZ='America/Los_Angeles' date '+%H:%M %Z')" || true
            git push
            echo "[DONE] committed signals.json"
          }

          # ── 5-min loop until 1:00 PM PT (market close) ──
          while true; do
            NOW_SEC=$(date +%s)
            CLOSE_SEC=$(python3 /tmp/pt_epoch.py 13 0)
            if [ "$NOW_SEC" -ge "$CLOSE_SEC" ]; then
              echo "[CLOSE] Market closed at 1:00 PM PT — scanner shutting down"
              break
            fi
            run_scan
            sleep 300
          done

          echo "[DONE] Full trading day complete."
