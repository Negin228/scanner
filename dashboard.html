<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Institutional Risk Terminal</title>
    <style>
        :root {
            --bg: #0b0e11;
            --text: #e0e0e0;
            --accent: #f0b90b;
            --green: #02c076;
            --red: #cf304a;
            --row-hover: #1e2329;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 20px; }
        h1 { color: var(--accent); border-bottom: 2px solid var(---accent); padding-bottom: 10px; }
        
        /* Risk Header Section */
        .summary-bar { display: flex; gap: 20px; margin-bottom: 20px; padding: 15px; background: #161a1e; border-radius: 8px; border-left: 5px solid var(--accent); }
        .stat { display: flex; flex-direction: column; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: #848e9c; }
        .stat-value { font-size: 18px; font-weight: bold; }

        /* Data Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { text-align: left; background: #1e2329; padding: 12px; color: #848e9c; cursor: pointer; }
        td { padding: 12px; border-bottom: 1px solid #2b2f36; }
        tr:hover { background: var(--row-hover); }

        /* Conditional Classes */
        .high-edge { color: var(--green); font-weight: bold; }
        .high-corr { background: rgba(207, 48, 74, 0.1); color: var(--red); }
        .qty-badge { background: var(--accent); color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Institutional Option Scanner <small style="font-size: 12px; color: #848e9c;">$100k Basis</small></h1>

    <div class="summary-bar" id="risk-header">
        <div class="stat"><span class="stat-label">Last Update</span><span id="update-time" class="stat-value">--:--:--</span></div>
        <div class="stat"><span class="stat-label">SPY Benchmark</span><span id="spy-price" class="stat-value">$0.00</span></div>
        <div class="stat"><span class="stat-label">Total Signals</span><span id="signal-count" class="stat-value">0</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Ticker</th>
                <th>Expiration</th>
                <th>Spread</th>
                <th>Net Credit</th>
                <th>PoP%</th>
                <th>EV ($)</th>
                <th>Edge Ratio</th>
                <th>Qty</th>
                <th>SPY Delta Eq</th>
                <th>Corr (SPY)</th>
            </tr>
        </thead>
        <tbody id="signal-table">
            <!-- Data injected here -->
        </tbody>
    </table>

    <script>
        async function refreshData() {
            try {
                const response = await fetch('signalskelly.json');
                const data = await response.json();
                
                document.getElementById('update-time').innerText = data.scan_time;
                document.getElementById('spy-price').innerText = `$${data.benchmark_spy}`;
                document.getElementById('signal-count').innerText = data.top_signals.length;

                const tableBody = document.getElementById('signal-table');
                tableBody.innerHTML = '';

                data.top_signals.forEach(s => {
                    const row = document.createElement('tr');
                    
                    // Logic: Flag high correlation to avoid cluster risk
                    if (s.correlation_spy > 0.85) row.classList.add('high-corr');

                    row.innerHTML = `
                        <td><b>${s.symbol}</b> <small style="color:#848e9c">$${s.price}</small></td>
                        <td>${s.expiration}</td>
                        <td>${s.spread}</td>
                        <td>$${s.net_credit.toFixed(2)}</td>
                        <td style="color:var(--green)">${s.pop_pct}%</td>
                        <td class="${s.ev > 0.2 ? 'high-edge' : ''}">$${s.ev.toFixed(2)}</td>
                        <td>${(s.edge_ratio * 100).toFixed(1)}%</td>
                        <td><span class="qty-badge">${s.rec_qty}</span></td>
                        <td style="color:${s.spy_delta_eq < 0 ? 'var(--red)' : 'var(--green)'}">${s.spy_delta_eq}</td>
                        <td>${s.correlation_spy.toFixed(2)}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (e) {
                console.error("Dashboard Sync Error:", e);
            }
        }

        setInterval(refreshData, 30000); // Sync every 30s
        refreshData();
    </script>
</body>
</html>
