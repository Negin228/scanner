<!DOCTYPE html>
<html>
<head>
    <title>Put Credit Spread Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
        }

        .header {
            padding: 12px;
            background: #111827;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 14px;
            border: none;
            cursor: pointer;
            background: #1f2937;
            color: white;
            border-radius: 6px;
        }

        button.active {
            background: #2563eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #1f2937;
            font-size: 13px;
            text-align: center;
        }

        th {
            background: #111827;
            position: sticky;
            top: 0;
        }

        .container {
            padding: 10px;
        }

        .meta {
            padding: 10px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<div class="header">
    <button onclick="setTab('all')" id="tab-all" class="active">All</button>
    <button onclick="setTab('top10')" id="tab-top10">Top 10</button>
    <button onclick="setTab('new')" id="tab-new">New</button>
</div>

<div class="meta" id="meta"></div>

<div class="container">
    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Exp</th>
                <th>DTE</th>
                <th>Strike</th>
                <th>Credit</th>
                <th>Delta</th>
                <th>IV</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
</div>

<script>

let data = {
    signals: [],
    top10: [],
    new_signals: [],
    last_updated: ""
};

let currentTab = "all";

function setTab(tab) {
    currentTab = tab;

    document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    document.getElementById("tab-" + tab).classList.add("active");

    render();
}

function pickData() {
    if (currentTab === "top10") return data.top10 || [];
    if (currentTab === "new") return data.new_signals || [];
    return data.signals || [];
}

function render() {
    const rows = document.getElementById("rows");
    rows.innerHTML = "";

    const list = pickData();

    document.getElementById("meta").innerText =
        `Last updated: ${data.last_updated || "N/A"} | ${currentTab.toUpperCase()} signals: ${list.length}`;

    list.forEach(s => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${s.symbol}</td>
            <td>${s.expiration}</td>
            <td>${s.dte || "-"}</td>
            <td>${s.short_strike || s.strike}</td>
            <td>${s.net_credit || s.credit}</td>
            <td>${s.delta ?? "-"}</td>
            <td>${s.iv_pct || s.iv || "-"}</td>
            <td>${s.score ?? "-"}</td>
        `;

        rows.appendChild(tr);
    });
}

async function loadData() {
    try {
        const res = await fetch("signalskelly.json?ts=" + new Date().getTime());
        data = await res.json();
        render();
    } catch (e) {
        console.log("Error loading data", e);
    }
}

// auto refresh every 5 seconds
setInterval(loadData, 5000);

// initial load
loadData();

</script>

</body>
</html>
