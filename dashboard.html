<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Put Credit Spread Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ================= YOUR EXISTING CSS (UNCHANGED) ================= */
:root {
  --bg:#0a0e14; --bg2:#0f1520; --bg3:#141c2b;
  --border:#1e2d45; --text:#c8d8ef;
  --text2:#7a9bbf; --text3:#3d5a7a;
  --green:#00e5a0; --cyan:#00cfff;
  --gold:#ffd166;
  --blue:#4d9fff;
  --purple:#b48eff;
  --mono:'IBM Plex Mono', monospace;
  --sans:'IBM Plex Sans', sans-serif;
}

body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; }

.header, .tab-bar { background:var(--bg2); border-bottom:1px solid var(--border); }

.tab {
  padding:12px 18px;
  cursor:pointer;
  color:var(--text3);
  font-family:var(--mono);
}

.tab.active { color:var(--text); border-bottom:2px solid var(--green); }

.tab-panel { display:none; }
.tab-panel.active { display:block; }

.tab-badge {
  margin-left:6px;
  font-size:10px;
  color:var(--text2);
}
/* =============================================================== */
</style>
</head>

<body>

<!-- HEADER (UNCHANGED) -->
<div class="header">
  Put Credit Spread Scanner
</div>

<!-- TAB BAR (UPDATED: NEW TAB ADDED) -->
<div class="tab-bar">

  <div class="tab active" id="tab-all" onclick="switchTab('all')">
    All <span class="tab-badge" id="badge-all">0</span>
  </div>

  <div class="tab" id="tab-new" onclick="switchTab('new')">
    New <span class="tab-badge" id="badge-new">0</span>
  </div>

  <div class="tab" id="tab-top10" onclick="switchTab('top10')">
    Top 10 <span class="tab-badge" id="badge-top10">0</span>
  </div>

  <div class="tab" id="tab-advanced" onclick="switchTab('advanced')">
    Advanced <span class="tab-badge" id="badge-advanced">0</span>
  </div>

</div>

<!-- ================= ALL TAB ================= -->
<div class="tab-panel active" id="panel-all">
  <div class="main">
    All Signals Table (your existing content stays here)
  </div>
</div>

<!-- ================= NEW TAB (ADDED) ================= -->
<div class="tab-panel" id="panel-new">
  <div class="main">

    <h3 style="color:var(--cyan); font-family:var(--mono);">
      New Signals (|Δ| ≤ 0.15)
    </h3>

    <table border="1" style="width:100%; font-family:var(--mono); font-size:12px;">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Expiry</th>
          <th>DTE</th>
          <th>Strikes</th>
          <th>Delta</th>
          <th>Credit</th>
          <th>Score</th>
        </tr>
      </thead>

      <tbody id="new-body">
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>

  </div>
</div>

<!-- ================= TOP 10 TAB ================= -->
<div class="tab-panel" id="panel-top10">
  <div class="main">
    Top 10 (unchanged)
  </div>
</div>

<!-- ================= ADVANCED TAB ================= -->
<div class="tab-panel" id="panel-advanced">
  <div class="main">
    Advanced (unchanged)
  </div>
</div>

<script>
let allSignals = [];
let top10 = [];
let advSignals = [];
let newSignals = [];   // ✅ ADDED

// ─────────────────────────────
// TAB SWITCH
// ─────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

// ─────────────────────────────
// FETCH DATA
// ─────────────────────────────
async function fetchData() {
  const res = await fetch('signalskelly.json?t=' + Date.now());
  const data = await res.json();
  processData(data);
}

// ─────────────────────────────
// PROCESS DATA (UPDATED)
// ─────────────────────────────
function processData(data) {

  allSignals = data.signals || [];
  top10 = data.top10 || [];
  advSignals = data.advanced_signals || [];
  newSignals = data.new_signals || [];   // ✅ IMPORTANT

  document.getElementById('badge-all').textContent = allSignals.length;
  document.getElementById('badge-top10').textContent = top10.length;
  document.getElementById('badge-advanced').textContent = advSignals.length;
  document.getElementById('badge-new').textContent = newSignals.length;  // ✅ NEW

  renderNew();   // ✅ NEW
}

// ─────────────────────────────
// RENDER NEW TAB
// ─────────────────────────────
function renderNew() {

  const tbody = document.getElementById('new-body');

  if (!newSignals.length) {
    tbody.innerHTML = `<tr><td colspan="7">No new signals</td></tr>`;
    return;
  }

  tbody.innerHTML = newSignals.map(s => `
    <tr>
      <td style="color:var(--cyan)">${s.symbol}</td>
      <td>${s.expiration}</td>
      <td>${s.dte}</td>
      <td>$${s.short_strike} / $${s.long_strike}</td>
      <td style="color:var(--blue)">${s.delta?.toFixed(3) ?? '—'}</td>
      <td style="color:var(--green)">$${s.net_credit.toFixed(2)}</td>
      <td>${s.score.toFixed(1)}</td>
    </tr>
  `).join('');
}

// ─────────────────────────────
// INIT
// ─────────────────────────────
fetchData();
setInterval(fetchData, 30000);

</script>

</body>
</html>
