<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Options Scanner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --bg2: #0f1520;
    --bg3: #141c2b;
    --bg4: #192234;
    --border: #1e2d45;
    --text: #c8d8ef;
    --text2: #7a9bbf;
    --text3: #3d5a7a;
    --green: #00e5a0;
    --red: #ff4d6a;
    --gold: #f5a623;
    --blue: #007bff;
  }

  * { box-sizing: border-box; }
  body { 
    background: var(--bg); color: var(--text); 
    font-family: 'IBM Plex Sans', sans-serif; margin: 0; padding: 20px; 
  }

  .header { 
    display: flex; justify-content: space-between; align-items: center; 
    margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px;
  }
  
  .update-status {
    display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    background: var(--bg2); padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border);
  }

  #status-dot {
    height: 8px; width: 8px; border-radius: 50%; margin-right: 10px;
    background-color: var(--text3);
  }

  .scanning-active #status-dot {
    background-color: var(--blue);
    box-shadow: 0 0 8px var(--blue);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

  #status-label { font-weight: 600; margin-right: 5px; }
  #last-updated { color: var(--text); }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { 
    padding: 10px 20px; cursor: pointer; background: var(--bg2);
    border: 1px solid var(--border); color: var(--text2); 
    font-weight: 500; border-radius: 6px;
  }
  .tab.active { background: var(--bg4); border-color: var(--text2); color: var(--text); }

  .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  th { background: var(--bg3); padding: 12px; color: var(--text2); font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 12px; border-bottom: 1px solid var(--border); }
  
  .bold { font-weight: 600; }
  .text-green { color: var(--green); }
  .text-gold { color: var(--gold); }

  button#refresh-btn {
    background: var(--bg4); border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  button#refresh-btn:hover { background: var(--border); }
</style>
</head>
<body>

<div class="header">
  <h2 style="margin:0">Options Scanner</h2>
  <div style="display: flex; gap: 15px; align-items: center;">
    <button id="refresh-btn" onclick="fetchData()">Manual Refresh</button>
    <div class="update-status" id="update-container">
      <div id="status-dot"></div>
      <span id="status-label">Last Update:</span>
      <span id="last-updated">--</span>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('all')" id="tab-all">All Signals</div>
  <div class="tab" onclick="switchTab('top10')" id="tab-top10">Top 10</div>
  <div class="tab" onclick="switchTab('advanced')" id="tab-advanced">Advanced</div>
</div>

<div id="panel-all" class="tab-panel"><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Exp</th><th>DTE</th><th>Strike</th><th>Credit</th><th>Score</th></tr></thead><tbody id="all-body"></tbody></table></div></div>
<div id="panel-top10" class="tab-panel" style="display:none"><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Exp</th><th>DTE</th><th>Strike</th><th>Credit</th><th>Score</th></tr></thead><tbody id="top10-body"></tbody></table></div></div>
<div id="panel-advanced" class="tab-panel" style="display:none"><div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Exp</th><th>Prob. Touch</th><th>RSI</th><th>Qty</th><th>Score</th></tr></thead><tbody id="advanced-body"></tbody></table></div></div>

<script>
  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
    document.getElementById('tab-' + tabId).classList.add('active');
    document.getElementById('panel-' + tabId).style.display = 'block';
  }

  async function fetchData() {
    const container = document.getElementById('update-container');
    const statusLabel = document.getElementById('status-label');
    const lastUpdatedElem = document.getElementById('last-updated');
    
    // 1. CLEAR THE UI IMMEDIATELY
    container.classList.add('scanning-active');
    statusLabel.innerText = "Updating...";
    lastUpdatedElem.innerText = "Checking server..."; // Remove old timestamp so you don't see it
    lastUpdatedElem.style.color = "var(--blue)";

    try {
      // 2. THE CACHE BUSTER (?t=...)
      // This forces the browser to bypass any saved versions of the file.
      const response = await fetch(`signals.json?t=${new Date().getTime()}`);
      
      if (!response.ok) throw new Error('Network response was not ok');
      
      const data = await response.json();

      // 3. RENDER DATA
      renderTable('all-body', data.signals);
      renderTable('top10-body', data.top10);
      renderAdvanced(data.advanced);

      // 4. RESTORE SUCCESS STATE
      statusLabel.innerText = "Updated:";
      lastUpdatedElem.innerText = data.last_updated;
      lastUpdatedElem.style.color = "var(--text)";
      container.classList.remove('scanning-active');

    } catch (e) {
      console.error("Fetch failed", e);
      statusLabel.innerText = "Error:";
      lastUpdatedElem.innerText = "Retry in 10s";
      lastUpdatedElem.style.color = "var(--red)";
      container.classList.remove('scanning-active');
    }
  }

  function renderTable(id, signals) {
    if (!signals) return;
    document.getElementById(id).innerHTML = signals.map(s => `
      <tr>
        <td class="bold">${s.symbol}</td>
        <td>${s.expiration}</td>
        <td>${s.dte}d</td>
        <td class="mono">${s.short_strike}/${s.long_strike}</td>
        <td class="text-green">$${s.net_credit}</td>
        <td class="bold">${s.score}</td>
      </tr>
    `).join('');
  }

  function renderAdvanced(signals) {
    if (!signals) return;
    document.getElementById('advanced-body').innerHTML = signals.map(s => `
      <tr>
        <td class="bold">${s.symbol}</td>
        <td>${s.expiration}</td>
        <td class="${s.pot > 25 ? 'text-red' : ''}">${s.pot}%</td>
        <td>${s.rsi}</td>
        <td class="text-green bold">${s.qty}</td>
        <td class="bold text-gold">${s.score}</td>
      </tr>
    `).join('');
  }

  // Automatic Refresh every 30 seconds
  setInterval(fetchData, 30000);
  fetchData();
</script>

</body>
</html>
